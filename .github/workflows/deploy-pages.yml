name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp index.html styles.css script.js khelsaathi-connect.js _site/
          cp assets/logo.svg _site/assets/logo.svg
          cp .nojekyll _site/.nojekyll 2>/dev/null || true

          python <<'PY'
          from pathlib import Path

          api_url = 'https://script.google.com/macros/s/AKfycbypuCFhBf6B15McAP4WtTe65ryExAvIoHQhpPO6TlWd5N083P8Ll-ekXlrmLJTV2uJ-jA/exec'

          script = Path('_site/script.js')
          script_content = script.read_text(encoding='utf-8').replace(
              "const KHELSAATHI_API_URL = '';",
              f"const KHELSAATHI_API_URL = '{api_url}';"
          )
          script.write_text(script_content, encoding='utf-8')

          index = Path('_site/index.html')
          index_content = index.read_text(encoding='utf-8').replace(
              '<script src="script.js"></script>',
              '<script src="script.js?v=20260805-5"></script>\n  <script src="khelsaathi-connect.js?v=20260805-5"></script>'
          )
          index.write_text(index_content, encoding='utf-8')
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
