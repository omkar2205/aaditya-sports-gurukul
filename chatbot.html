  <button class="ks-launcher" id="ksLauncher" type="button" aria-label="Open KhelSaathi" aria-controls="ksChat" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8z"/></svg>
  </button>

  <aside class="ks-chat" id="ksChat" aria-label="KhelSaathi chatbot" aria-hidden="true">
    <header class="ks-header">
      <div class="ks-identity">
        <span class="ks-header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8z"/></svg>
        </span>
        <span><strong>KhelSaathi</strong><small id="ksStatus" data-state="connecting"><i></i>Connecting</small></span>
      </div>
      <button class="ks-close" id="ksClose" type="button" aria-label="Close KhelSaathi">×</button>
    </header>

    <div class="ks-messages" id="ksMessages" aria-live="polite">
      <div class="ks-row ks-assistant">
        <span class="ks-message-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8z"/></svg>
        </span>
        <div class="ks-bubble">Hi, I’m KhelSaathi. I can help you find a coach, understand the plans or complete your athlete profile.</div>
      </div>
    </div>

    <div class="ks-quick" id="ksQuick" aria-label="Suggested questions">
      <button type="button" data-message="Help me find the right coach">Find a coach</button>
      <button type="button" data-message="Which membership plan suits me?">Choose a plan</button>
      <button type="button" data-message="How does coach matching work?">How matching works</button>
    </div>

    <form class="ks-form" id="ksForm">
      <label class="sr-only" for="ksInput">Message KhelSaathi</label>
      <textarea id="ksInput" rows="1" maxlength="600" placeholder="Message KhelSaathi"></textarea>
      <button type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </form>
  </aside>
